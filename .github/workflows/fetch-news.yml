name: Weekly News Fetch

on:
  schedule:
    # Every Monday at 10:00 AM EST (15:00 UTC)
    - cron: '0 15 * * 1'
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest briefings
        run: node scripts/fetch-news.mjs

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet src/data/news.ts && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & push updated news
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "RoveLab News Bot"
          git config user.email "bot@rovelab.com"
          git add src/data/news.ts
          git commit -m "chore: weekly news update $(date -u +'%Y-%m-%d')"
          git push
